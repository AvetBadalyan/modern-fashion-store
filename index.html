<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link
			rel="icon"
			type="image/svg+xml"
			href="/favicon.svg"
		/>
		<link
			rel="apple-touch-icon"
			href="/favicon.svg"
		/>
		<link
			rel="preconnect"
			href="https://images.unsplash.com"
		/>
		<!-- Hero image (LCP on the home page). Same srcset/sizes as Home.jsx so the
		     browser reuses this download instead of fetching a second file. -->
		<link
			rel="preload"
			as="image"
			imagesrcset="https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=640&amp;q=80&amp;auto=format&amp;fit=crop 640w, https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=1000&amp;q=80&amp;auto=format&amp;fit=crop 1000w, https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=1600&amp;q=80&amp;auto=format&amp;fit=crop 1600w"
			imagesizes="100vw"
			fetchpriority="high"
		/>
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<meta
			name="description"
			content="Modern Fashion Store — Shop curated men's and women's clothing, shoes and accessories with size and color variants, wishlist and fast checkout."
		/>
		<meta
			name="theme-color"
			content="#faf9f7"
		/>
		<meta
			property="og:type"
			content="website"
		/>
		<meta
			property="og:title"
			content="Modern Fashion Store"
		/>
		<meta
			property="og:description"
			content="Modern Fashion Store — Shop curated men's and women's clothing, shoes and accessories with size and color variants, wishlist and fast checkout."

		<meta
			property="og:image"
			content="https://images.unsplash.com/photo-1483985988355-763728e1935b?w=1200&q=80"
		/>

			name="twitter:card"
			content="summary_large_image"
		/>
		<meta
			name="twitter:title"
			content="Modern Fashion Store"
		/>
		<meta
			name="twitter:description"
			content="Modern Fashion Store — Shop curated men's and women's clothing, shoes and accessories with size and color variants, wishlist and fast checkout."
		/>
		<meta
			name="twitter:image"
			content="https://images.unsplash.com/photo-1483985988355-763728e1935b?w=1200&q=80"
		/>
		<title>Modern Fashion Store</title>
		<link
			rel="preconnect"
			href="https://fonts.googleapis.com"
		/>
		<link
			rel="preconnect"
			href="https://fonts.gstatic.com"
			crossorigin
		/>
		<link
			rel="preload"
			as="style"
			href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500;600;700&display=swap"
		/>

			href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500;600;700&display=swap"
			rel="stylesheet"
			media="print"
			onload="this.media='all'"
		/>
		<noscript>
			<link
				href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500;600;700&display=swap"
